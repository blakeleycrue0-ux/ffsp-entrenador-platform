# ════════════════════════════════════════════════════════════════════════════
# Publicación en Netlify
# ════════════════════════════════════════════════════════════════════════════
#
# Sin este archivo, Netlify no sabe que esto es un proyecto que hay que
# construir: publica el repositorio tal cual. Y el `index.html` del repositorio
# apunta a `/src/main.tsx`, que es TypeScript: el navegador no sabe ejecutarlo,
# aborta y deja la página en blanco, sin ningún mensaje.
#
# Aquí se dice lo único que falta: qué comando construye el sitio y qué carpeta
# hay que publicar.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Se fija la versión de Node para que la publicación no cambie de
  # comportamiento el día que Netlify actualice la suya por defecto.
  NODE_VERSION = "20"

# ── Funciones ───────────────────────────────────────────────────────────────
# El cobro necesita servidor. La clave secreta de Stripe y la clave de servicio
# de Supabase viven aquí y NUNCA en el navegador: con cualquiera de las dos se
# podría cobrar en nombre del club o leer la base de datos entera saltándose
# las políticas de acceso.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Rutas ───────────────────────────────────────────────────────────────────
# La aplicación resuelve sus rutas en el navegador, así que en el servidor sólo
# existe un archivo. Sin esta regla, entrar directamente en /entrar o /app —o
# simplemente recargar la página— devuelve un 404.
#
# PERO LA REGLA NO PUEDE SER PARA TODO. Las pantallas se descargan por separado
# y llevan un identificador en el nombre; al publicar una versión nueva, los
# archivos de la anterior dejan de existir. Con el comodín a secas, pedir uno
# de esos archivos devolvía el índice con un 200 y el navegador intentaba
# ejecutar HTML como si fuera JavaScript:
#
#   Failed to load module script: Expected a JavaScript-or-Wasm module script
#   but the server responded with a MIME type of "text/html"
#
# Un 404 de verdad es más claro para depurar y, sobre todo, deja que el
# navegador y `cargaDiferida` lo traten como lo que es: un archivo que no está.
# El orden importa: esta regla va ANTES del comodín.
#
# ⚠ LA REGLA NECESITA DESTINO, Y SIN ÉL NO ES QUE FALLE: ES QUE NO EXISTE.
# Esto se escribió primero sin `to`, pensando que con el estado bastaba. Netlify
# la descartaba por inválida —«1 invalid redirect rule», en la comprobación de
# cada publicación— y seguía adelante con las demás. O sea que durante varias
# versiones el comodín de abajo se tragaba también los fragmentos que faltaban,
# devolvía el índice con un 200, y el problema que esta regla venía a arreglar
# seguía exactamente igual. Una regla inválida no avisa en el sitio donde se
# usa: se cae en silencio y deja la impresión de estar protegido.
#
# `force = false` no sobra: hace que la regla sólo actúe cuando el archivo NO
# está. Los que sí existen se sirven con normalidad.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cabeceras ───────────────────────────────────────────────────────────────
#
# CUIDADO CON ESTO. Netlify decide las cabeceras por la ruta que PIDE el
# navegador, no por el archivo que acaba sirviendo. Como la regla de arriba
# reescribe cualquier ruta a /index.html, una regla escrita `for = "/index.html"`
# sólo se aplicaba a quien pidiera literalmente esa dirección: nadie. Quien
# entraba en «/» o en «/app/...» recibía el índice sin instrucción de caché, se
# lo quedaba guardado, y seguía ejecutando la versión anterior durante horas
# aunque ya estuviera publicada otra. Costó una tarde entera de depuración.
#
# Por eso ahora la norma general es no guardar nada, y se hacen excepciones
# para lo que sí se puede. El orden importa: las reglas posteriores mandan
# sobre las anteriores cuando ambas encajan.

# Norma general: revalidar siempre. Cubre el índice llegue por donde llegue.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

# Los archivos de `assets` llevan un identificador en el nombre: cuando cambia
# el contenido, cambia el nombre. Por eso pueden guardarse indefinidamente.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las capturas e imágenes de la página pública cambian poco y pesan.
[[headers]]
  for = "/producto/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
