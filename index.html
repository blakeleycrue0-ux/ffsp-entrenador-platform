<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/playoff360.png" />
    <link rel="apple-touch-icon" href="/playoff360.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- UNO POR TEMA. Era uno solo, «#050505», de cuando la plataforma era
         oscura: en claro teñía de negro la barra de Safari y ya no pegaba con
         nada. Cada uno lleva el color REAL del fondo de su tema —el mismo
         `--surface` de `index.css`—, así que la barra del navegador y la app
         son una sola superficie y no se ve dónde acaba una y empieza otra. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E8E8EB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0A0A0C" />

    <title>Playoff360 · Sistema para entrenadores</title>
    <meta
      name="description"
      content="Plantilla, asistencia, entrenamientos, partidos y convocatorias en un solo sitio. El sistema de gestión del club, para cualquier deporte."
    />

    <!-- Cómo se ve al compartir el enlace. La imagen es una captura real. -->
    <meta property="og:type" content="website" />
    <!-- La de la portada. Para el resto de páginas la corrige `Canonico` al
         cambiar de ruta, junto con la canónica. -->
    <meta property="og:url" content="https://playoff360.site/" />
    <meta property="og:site_name" content="Playoff360" />
    <meta property="og:title" content="Playoff360 · Sistema para entrenadores" />
    <meta
      property="og:description"
      content="Plantilla, asistencia, entrenamientos, partidos y convocatorias en un solo sitio. Para cualquier club."
    />
    <!-- ABSOLUTA, Y NO ES UN DETALLE. Estaba como «/producto/og.png», que el
         navegador resuelve bien pero los rastreadores que leen el HTML sin
         ejecutarlo —WhatsApp, Facebook, Telegram, Slack— no: la mayoría exige
         una dirección completa y, al no encontrarla, comparten el enlace sin
         imagen. La captura existía y estaba bien; lo que fallaba era cómo se
         nombraba. -->
    <meta property="og:image" content="https://playoff360.site/producto/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- LAS TIPOGRAFÍAS VIVEN AQUÍ, NO EN GOOGLE.
         Antes se pedían a fonts.googleapis.com: dos viajes de ida y vuelta a
         otro dominio (DNS, TLS, la hoja de estilo y sólo entonces el archivo)
         antes de poder pintar una sola letra, y la portada entera dependía de
         que un tercero respondiera. Ahora son cuatro archivos del mismo
         servidor, 90 kB en total, declarados en `index.css` y precargados
         aquí: la letra sale a la primera y sin pedir permiso a nadie.

         EJE VARIABLE, no seis pesos sueltos. Con los pesos sueltos, pedir 540
         redondeaba a 500 y pedir 560 a 600, así que dos titulares seguidos
         salían con pesos distintos sin que nadie lo hubiera pedido. Con el eje
         continuo, 540 es 540. Y es un archivo por familia en vez de seis.

         Sólo se precarga el subconjunto latino: el extendido lo pide el
         navegador si hace falta, y en castellano casi nunca hace falta. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fuentes/space-grotesk-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fuentes/jakarta-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fuentes/schibsted-latin.woff2" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
